name: CI

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore / build solution
        run: |
          dotnet restore src-templates/DatabaseModernization.sln
          dotnet build src-templates/DatabaseModernization.sln --no-restore -c Release

      - name: Test DbIntelligence
        run: dotnet test src-templates/DbIntelligence/DbIntelligence.Tests/DbIntelligence.Tests.csproj -c Release --no-build --verbosity minimal

      - name: Test FindingsMigration
        run: dotnet test src-templates/FindingsMigration/FindingsMigration.Tests/FindingsMigration.Tests.csproj -c Release --no-build --verbosity minimal

      - name: Test Showcase
        run: dotnet test src-templates/DataServices/ShowcaseDataService/ShowcaseDataService.Tests/ShowcaseDataService.Tests.csproj -c Release --no-build --verbosity minimal

  confidence-gate:
    runs-on: windows-latest
    needs: build-test
    if: ${{ hashFiles('**/code-to-db-map.json') != '' || hashFiles('manifests/domains/*.yml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build FindingsMigration.Cli
        run: dotnet build src-templates/FindingsMigration/FindingsMigration.Cli/FindingsMigration.Cli.csproj -c Release
      - name: Run confidence gate when map present
        shell: pwsh
        run: |
          $map = Get-ChildItem -Recurse -Filter code-to-db-map.json -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\bin\\|\\obj\\' } |
            Select-Object -First 1
          if (-not $map) {
            Write-Host "No code-to-db-map.json in repo — skipping gate (advisory)."
            exit 0
          }
          $manifests = "manifests/domains"
          if (-not (Test-Path $manifests)) {
            Write-Host "No manifests/domains — skipping gate."
            exit 0
          }
          $baseline = "validation/ambiguous-baseline.txt"
          $ack = "validation/AMBIGUOUS-ACK.md"
          $args = @(
            "run", "--no-build", "-c", "Release",
            "--project", "src-templates/FindingsMigration/FindingsMigration.Cli/FindingsMigration.Cli.csproj",
            "--", "confidence-gate",
            "--code-to-db", $map.FullName,
            "--manifests", $manifests
          )
          if (Test-Path $baseline) { $args += @("--ambiguous-baseline", $baseline) }
          if (Test-Path $ack) { $args += @("--review-ack", $ack) }
          & dotnet @args
          exit $LASTEXITCODE
