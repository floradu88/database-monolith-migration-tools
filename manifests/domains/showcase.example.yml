domain: showcase
owner_team: Showcase Platform
source_database: MonolithDb
source_projects:
  - Monolith.Database.Composite
target_service: ShowcaseDataService
target_database: ShowcaseOwned
target_schema: showcase
database_change_model: hybrid
sql_project_owns:
  - schemas
  - stored_procedures
  - functions
  - views
  - security
  - deployment.DatabaseContract
ef_migrations_own:
  - showcase.Items
runtime_identity: ShowcaseDataService.Runtime
migration_identity: ShowcaseDataService.Migration
cutover:
  sql_project: ShowcaseDataService.Database
  cutover_scripts: ShowcaseDataService.Database/Cutover
  strategy: FacadeThenMove
dbo_core_parallel_write:
  enabled: true
  source_schema: dbo
  owned_schema: core
  tables:
    - dbo.ShowcaseWorkItem
    - core.ShowcaseWorkItem
  history: delta_only
  coverage: stored_procedure_writes_only
  dbo_extras: expected
  mismatch: evidence_only
  integrity_proc: core.usp_TableIntegrity_Check
  integrity_rule: core_subset_of_dbo
read_scaling:
  replica_safe_operations:
    - GetShowcaseSummary
sharding:
  enabled: false
