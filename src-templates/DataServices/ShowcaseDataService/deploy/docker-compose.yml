# Blue/Green local demo for ShowcaseDataService
# Usage: docker compose --profile blue --profile green up --build
services:
  showcase-blue:
    profiles: ["blue"]
    build:
      context: ../../..
      dockerfile: DataServices/ShowcaseDataService/deploy/Dockerfile
    ports:
      - "5081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MigrationRouting__Slot: Blue
      MigrationRouting__DefaultRoute: SourceFacade
      Database__Schema: showcase
      Database__Owned__Provider: OnPrem
      Database__SourceFacade__Provider: OnPrem
      Database__SourceFacade__ConnectionString: "Server=host.docker.internal,1433;Database=MonolithDb;User Id=app_ro;Password=CHANGE_ME;TrustServerCertificate=True"
      Database__Owned__ConnectionString: "Server=host.docker.internal,1433;Database=ShowcaseDb;User Id=app_rw;Password=CHANGE_ME;TrustServerCertificate=True"

  showcase-green:
    profiles: ["green"]
    build:
      context: ../../..
      dockerfile: DataServices/ShowcaseDataService/deploy/Dockerfile
    ports:
      - "5082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MigrationRouting__Slot: Green
      MigrationRouting__DefaultRoute: Owned
      Database__Schema: showcase
      Database__Owned__Provider: OnPrem
      Database__SourceFacade__Provider: OnPrem
      Database__SourceFacade__ConnectionString: "Server=host.docker.internal,1433;Database=MonolithDb;User Id=app_ro;Password=CHANGE_ME;TrustServerCertificate=True"
      Database__Owned__ConnectionString: "Server=host.docker.internal,1433;Database=ShowcaseDb;User Id=app_rw;Password=CHANGE_ME;TrustServerCertificate=True"
