apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "showcase.fullname" . }}-blue
  labels:
    app.kubernetes.io/name: showcase-dataservice
    app.kubernetes.io/component: blue
spec:
  replicas: {{ .Values.replicaCountBlue }}
  selector:
    matchLabels:
      app.kubernetes.io/name: showcase-dataservice
      app.kubernetes.io/component: blue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: showcase-dataservice
        app.kubernetes.io/component: blue
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: MigrationRouting__Slot
              value: {{ .Values.blue.slot | quote }}
            - name: MigrationRouting__DefaultRoute
              value: {{ .Values.blue.defaultRoute | quote }}
            - name: SqlConnections__SourceFacadeConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecretName }}
                  key: {{ .Values.sourceConnectionKey }}
            - name: SqlConnections__OwnedConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecretName }}
                  key: {{ .Values.ownedConnectionKey }}
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
