{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "showcase.fullname" . }}
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "{{ .Values.ingress.greenWeight }}"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "showcase.fullname" . }}-blue
                port:
                  number: {{ .Values.service.port }}
    - host: showcase-blue.{{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "showcase.fullname" . }}-blue
                port:
                  number: {{ .Values.service.port }}
    - host: showcase-green.{{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "showcase.fullname" . }}-green
                port:
                  number: {{ .Values.service.port }}
{{- end }}
